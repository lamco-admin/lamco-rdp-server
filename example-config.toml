# lamco-rdp-server Configuration Example
#
# Values here are checked against Config::default() by
# tests::example_config_matches_current_schema (src/config/mod.rs) — if you
# change a default, update this file in the same commit or that test fails.
#
# Location depends on deployment:
# - Native (root): /etc/lamco-rdp-server/config.toml
# - Native (user): ~/.config/lamco-rdp-server/config.toml
# - Flatpak: ~/.var/app/io.lamco.rdp-server/config/config.toml
#
# Or specify with --config flag

# Configuration format version (for future migration support)
# config_version = 1

# =============================================================================
# Server Settings
# =============================================================================
[server]
# Listen address and port (format: IP:PORT). "[::]:3389" is the default and
# dual-stacks on Linux (net.ipv6.bindv6only=0): one socket accepts both IPv6
# and IPv4 clients (IPv4 arrives as an IPv4-mapped address). Use "0.0.0.0:3389"
# to force IPv4-only.
listen_addr = "[::]:3389"
# Maximum concurrent connections (0 = unlimited)
max_connections = 10
# Session timeout in seconds (0 = no timeout)
session_timeout = 0
# Use XDG Desktop Portals for screen capture (recommended)
use_portals = true
# View-only mode: video streaming only, no input injection or clipboard
# Useful for monitoring, presentations, or compositors without RemoteDesktop portal
# view_only = false

# =============================================================================
# Security Configuration
# =============================================================================
[security]
# TLS certificate path (PEM format)
# Native (root): /etc/lamco-rdp-server/cert.pem
# Native (user): ~/.config/lamco-rdp-server/cert.pem
# Flatpak: ~/.var/app/io.lamco.rdp-server/config/config.toml
cert_path = "/etc/lamco-rdp-server/cert.pem"
# TLS private key path (PEM format)
# Same directory as certificate
key_path = "/etc/lamco-rdp-server/key.pem"

# Enable Network Level Authentication (requires auth_method = "pam")
# NLA authenticates before establishing the RDP session
enable_nla = false

# Authentication method:
#   "none" - No authentication required (default)
#            Anyone who can reach the server can view your desktop.
#            Appropriate for: personal use, trusted networks, Flatpak.
#   "pam"  - PAM authentication against system accounts
#            Requires valid system username/password to connect.
#            Only available in native installs (not Flatpak).
#            If configured but unavailable, falls back to "none" with warning.
auth_method = "none"

# Require TLS 1.3 (more secure but may have compatibility issues)
require_tls_13 = false

# Pre-loaded CredSSP credentials (required for security_mode = "hybrid" without
# PAM). IronRDP's acceptor needs to know the expected password to run the NTLM
# challenge-response; without it the server errors out with
# "no credentials while doing credssp" and clients see an EOF mid-handshake.
#
# Leave this section out for tls-only operation.
#
# [security.credssp_credentials]
# username = "your-user"
# password = "your-password"
# domain = ""  # optional

# =============================================================================
# Video Configuration
# =============================================================================
# Note: Encoder settings are in [hardware_encoding], bitrate in [egfx],
# and damage tracking in [damage_tracking] sections below.

[video]
# Target frames per second
target_fps = 30
# Cursor mode: "metadata" (separate), "embedded" (in frame), "hidden"
cursor_mode = "metadata"

# =============================================================================
# Audio Configuration (RDPSND)
# =============================================================================
[audio]
# Enable audio streaming to RDP client
enabled = true
# Preferred codec: "opus", "pcm", "adpcm", "auto"
# - opus: High quality, low bandwidth (recommended)
# - pcm: Uncompressed, highest quality
# - adpcm: Legacy compatibility
# - auto: Client chooses best supported codec
codec = "auto"
# Sample rate in Hz: 8000, 16000, 22050, 44100, 48000
sample_rate = 48000
# Channels: 1 (mono), 2 (stereo)
channels = 2
# Frame duration in ms: 10, 20, 40, 60 (lower = less latency)
frame_ms = 20
# OPUS bitrate in bps (32000-256000 typical)
opus_bitrate = 64000

# =============================================================================
# Capture Protocol Configuration (portal-generic strategy)
# =============================================================================
# These settings control which Wayland capture protocol is used when the server
# connects directly to the compositor (portal-generic strategy). They have no
# effect when using XDG Desktop Portal-based capture.
[capture]
# Capture protocol preference: "auto", "ext", "wlr"
# - "auto": Auto-detect best available (ext preferred, wlr fallback)
# - "ext": Prefer ext-image-copy-capture-v1 (staging standard)
# - "wlr": Prefer wlr-screencopy-unstable-v1 (wlroots)
protocol = "auto"
# Allow fallback to alternative capture protocol if preferred is unavailable
allow_fallback = true
# How a monitor is recorded on GNOME: "auto", "area", or "monitor".
#
# Mutter stops recording a monitor stream entirely while a fullscreen or
# maximised surface is handed to direct scanout, so a video freezes the remote
# picture for its whole duration (GNOME/mutter#3903, fix in mutter!5276, not yet
# released). Recording an area of the stage instead re-paints rather than
# copying the scanout buffer, and keeps producing frames.
#
# "auto" records an area when the compositor gives us a rectangle and is driving
# a single monitor, and the monitor otherwise. An area's rectangle is fixed when
# the stream is created, so the server rebuilds the stream when the host's
# resolution, scale or layout changes.
gnome_record_mode = "auto"

# Mark a headless GNOME session's virtual monitor as part of the platform.
#
# Sets "is-platform" on Mutter's RecordVirtual, which Mutter documents as the
# output not being "interpreted as if the screen is shared, but more
# transparently as if it was a real monitor". For a headless server the virtual
# monitor genuinely is the session's only display, so that is the accurate
# description, and it suppresses the screen-sharing treatment GNOME otherwise
# applies.
#
# Off by default, which is the behaviour before this setting existed. It only
# affects headless sessions, since is-platform is a RecordVirtual property that
# monitor and area sessions never send. Mutter builds that predate the property
# ignore it rather than failing.
gnome_virtual_is_platform = false

# Ext-capture handshake timeout in milliseconds
# How long to wait for the compositor to deliver constraint events after
# requesting an ext-image-copy-capture session. Some compositors advertise
# the protocol but don't fully implement it (e.g., Hyprland 0.54+).
# Set to 0 to disable the timeout.
handshake_timeout_ms = 5000

# =============================================================================
# Input Configuration
# =============================================================================
[input]
# Input injection protocol: "auto" (compositor-preferred), "libei" (Wayland
# native), or "wlr" (wlr-virtual-pointer/keyboard, wlroots compositors only)
input_protocol = "auto"
# Keyboard layout: "auto" (detect from client) or specific layout
keyboard_layout = "auto"
# Enable touch input support
enable_touch = false

# =============================================================================
# Clipboard Configuration
# =============================================================================
[clipboard]
# Enable clipboard synchronization
enabled = true
# Maximum clipboard size in bytes (10 MB default)
max_size = 10485760
# Rate limit between clipboard operations in ms
rate_limit_ms = 200
# Allowed MIME types (empty = all types allowed)
# Example: ["text/plain", "text/html", "image/png"]
allowed_types = []
# Clipboard protocol preference: "auto", "ext", "wlr"
# - "auto": Auto-detect best available (ext preferred, wlr fallback)
# - "ext": Prefer ext-data-control-v1 (staging standard)
# - "wlr": Prefer wlr-data-control-v1 (wlroots)
# Only relevant for portal-generic strategy (direct Wayland access).
protocol = "auto"
# Allow fallback to alternative clipboard protocol if preferred is unavailable
allow_fallback = true

# File transfer mode: "auto", "fuse", "staging", "portal"
# - "auto": FUSE in native mode, staging in Flatpak
# - "fuse": Force FUSE virtual filesystem (on-demand fetch, native only)
# - "staging": Force staging download (download all upfront, universal)
# file_transfer_mode = "auto"
# Download directory for staging file transfer
# file_transfer_download_dir = "~/Downloads"
# Strategy override (for development/testing): "portal", "mutter", "data_control", "wl_clipboard"
# strategy_override = ""

# [EXPERIMENTAL] Include x-kde-syncselection hint for Klipper
# When enabled on KDE Plasma, adds "application/x-kde-syncselection" to clipboard
# announcements. This causes Klipper to skip processing entirely, preventing takeover.
#
# WARNING: This MIME type is for Klipper's internal use. Using it may:
#   - Prevent Klipper features (clipboard history, URL actions)
#   - Interfere with KDE's clipboard synchronization
#   - Break in future Plasma versions
#
# RECOMMENDED: Leave disabled (false) and use re-announce mitigation instead.
# Only enable for testing or if re-announce doesn't work.
# Default: false
kde_syncselection_hint = false

# =============================================================================
# Multi-Monitor Configuration
# =============================================================================
[multimon]
# Enable multi-monitor support
enabled = true
# Maximum number of monitors to share
max_monitors = 4

# =============================================================================
# Performance Configuration
# =============================================================================
[performance]
# Encoder threads (0 = auto-detect)
encoder_threads = 0
# Network threads (0 = auto-detect)
network_threads = 0
# Frame buffer pool size
buffer_pool_size = 16
# Enable zero-copy frame passing
zero_copy = true

# Adaptive FPS - dynamically adjust framerate based on activity
[performance.adaptive_fps]
enabled = true
min_fps = 5
max_fps = 30
# Activity thresholds (fraction of screen changed)
high_activity_threshold = 0.3
medium_activity_threshold = 0.1
low_activity_threshold = 0.01

# Latency tuning
[performance.latency]
# Mode: "interactive" (gaming), "balanced", "quality"
mode = "balanced"
interactive_max_delay_ms = 16
balanced_max_delay_ms = 33
quality_max_delay_ms = 100
balanced_damage_threshold = 0.02
quality_damage_threshold = 0.05

# =============================================================================
# Logging Configuration
# =============================================================================
[logging]
# Log level: "trace", "debug", "info", "warn", "error"
level = "info"
# Log directory (optional, logs to stderr if not set)
# Native (root): /var/log/lamco-rdp-server
# Native (user): ~/.local/share/lamco-rdp-server/logs
# Flatpak: ~/.var/app/io.lamco.rdp-server/data/logs
# log_dir = "/var/log/lamco-rdp-server"
# Enable metrics collection
metrics = true

# =============================================================================
# EGFX Configuration (Graphics Pipeline Extension)
# =============================================================================
[egfx]
# Enable EGFX channel for improved graphics
enabled = true
# H.264 profile level: "auto", "4.1", "4.2", "5.0", "5.1"
h264_level = "auto"
# H.264 bitrate in kbps
h264_bitrate = 5000
# ZGFX compression: "never", "auto", "always"
zgfx_compression = "never"
# Maximum frames in flight before waiting for ACK
max_frames_in_flight = 3
# Frame acknowledgement timeout in ms
frame_ack_timeout = 5000
# IDR frame interval for recovery (seconds)
periodic_idr_interval = 5
# Codec selection: "avc420", "avc444", "auto"
codec = "auto"
# Quality parameters (lower = better quality, larger files)
qp_min = 10
qp_max = 40
qp_default = 23
# AVC444 for full chroma (better color accuracy)
avc444_enabled = true
avc444_aux_bitrate_ratio = 0.5
color_matrix = "auto"
color_range = "auto"
# Aux omission optimization
avc444_enable_aux_omission = true
avc444_max_aux_interval = 30
avc444_aux_change_threshold = 0.05
# Must be false: forcing an IDR on aux-stream return only makes sense with a
# second encoder instance to force. A single encoder can't honor this.
avc444_force_aux_idr_on_return = false

# Encoding adaptation: closed-loop QP adjustment from EGFX client feedback.
# When enabled, the server dynamically adjusts H.264 quality (QP) based on
# client decode queue depth. This prevents overwhelming slow clients while
# maximizing quality for fast clients.
[egfx.encoding_adaptation]
# Enable adaptive QP (disabled by default — opt-in after validation)
enabled = false
# Base QP value (used when queue is normal, replaces hardcoded default)
base_qp = 22
# Minimum QP (highest quality)
min_qp = 18
# Maximum QP (lowest quality, used under severe backpressure)
max_qp = 42
# Minimum interval between adaptation evaluations (ms)
# Prevents rapid oscillation — lower values are more responsive but riskier
evaluation_interval_ms = 500
# Queue depth threshold for moderate backpressure (QP +4)
moderate_queue_threshold = 3
# Queue depth threshold for severe backpressure (QP +10)
severe_queue_threshold = 6

# =============================================================================
# Damage Tracking Configuration
# =============================================================================
[damage_tracking]
# Enable damage tracking (highly recommended)
enabled = true
# Method: "pipewire", "diff", "hybrid"
method = "diff"
# Tile size for damage detection
tile_size = 16
# Difference threshold to trigger update
diff_threshold = 0.01
# Pixel threshold for change detection
pixel_threshold = 1
# Merge nearby damage regions within this distance
merge_distance = 16
# Minimum area to consider as damage
min_region_area = 64
# Percentage-point divergence between a compositor's damage-region hint and
# the periodic pixel-diff calibration probe above which one sample counts
# as "high divergence"
compositor_hint_distrust_threshold_pp = 15.0
# Consecutive high-divergence samples before compositor damage hints are
# distrusted for the rest of the connection (falls back to pixel-diff)
compositor_hint_distrust_consecutive_samples = 3

# =============================================================================
# Hardware Encoding Configuration
# =============================================================================
[hardware_encoding]
# Enable hardware encoding (VA-API, NVENC, Vulkan Video)
enabled = false
# VA-API device path
vaapi_device = "/dev/dri/renderD128"
# Enable DMA-BUF zero-copy capture
enable_dmabuf_zerocopy = true
# Fall back to software if hardware fails
fallback_to_software = true
# Quality preset: "speed", "balanced", "quality"
quality_preset = "balanced"
# Prefer NVENC over VA-API if available
prefer_nvenc = true
# Backend probe order when multiple hardware encoders are available
backend_priority = ["vulkan-video", "nvenc", "vaapi"]
# Vulkan device selection: "auto" or an explicit device index/name
vulkan_device = "auto"

# =============================================================================
# Display Configuration
# =============================================================================
[display]
# Allow client to request resize
allow_resize = true
# Allowed resolutions (empty = any)
# Example: ["1920x1080", "2560x1440", "3840x2160"]
allowed_resolutions = []
# Enable DPI-aware scaling
dpi_aware = false
# Frame transform applied to captured frames: "auto", "none", or an explicit
# rotation/flip (compositor-dependent)
frame_transform = "auto"
# Read per-output HDR/color state via wp-color-management (for HDR-aware
# encoding decisions). No effect if the compositor lacks the protocol.
color_management = true
# Read wlroots output heads/modes via zwlr-output-management (wlroots
# compositors only).
output_management = true
# On a client resize, drive a real wlroots output-mode change so the source
# output physically switches resolution (needs output_management). If false,
# only the capture is re-created.
resize_drives_output_mode = true
# Apply HDR->SDR tone mapping to captured frames when the source is HDR. Off by
# default: enable only if your compositor sends PQ/HLG pixels over the capture
# stream (many tone-map to SDR themselves, where this would wash the image out).
hdr_tone_mapping = false

# =============================================================================
# Advanced Video Configuration
# =============================================================================
[advanced_video]
# Enable frame skipping under load
enable_frame_skip = true
# Scene change threshold for IDR frames
scene_change_threshold = 0.7
# Intra refresh interval (frames)
intra_refresh_interval = 300
# Enable adaptive quality based on network
enable_adaptive_quality = false

# =============================================================================
# Cursor Configuration
# =============================================================================
[cursor]
# Cursor strategy: "metadata", "painted", "hidden", "predictive"
mode = "metadata"
# Auto-select mode based on latency
auto_mode = true
# Latency threshold for predictive mode (ms)
predictive_latency_threshold_ms = 100
# Cursor update rate (Hz)
cursor_update_fps = 60

# Cursor predictor settings (for predictive mode)
[cursor.predictor]
history_size = 8
lookahead_ms = 50.0
velocity_smoothing = 0.4
acceleration_smoothing = 0.2
max_prediction_distance = 100
min_velocity_threshold = 50.0
stop_convergence_rate = 0.5

# =============================================================================
# Video Pipeline Configuration (Advanced)
# =============================================================================
[video_pipeline.processor]
target_fps = 30
max_queue_depth = 30
adaptive_quality = true
damage_threshold = 0.05
drop_on_full_queue = true
enable_metrics = true

[video_pipeline.dispatcher]
channel_size = 30
priority_dispatch = true
max_frame_age_ms = 150
enable_backpressure = true
high_water_mark = 0.8
low_water_mark = 0.5
load_balancing = true

[video_pipeline.converter]
buffer_pool_size = 8
enable_simd = true
damage_threshold = 0.75
enable_statistics = true

# =============================================================================
# Notification Configuration (Flatpak portal notifications)
# =============================================================================
[notifications]
# Notify on server errors
on_error = true
# Notify on TLS certificate expiry warnings
on_cert_expiry = true

# =============================================================================
# Monitoring and Metrics Configuration
# =============================================================================
[monitoring]
# Enable performance snapshot collection and D-Bus PerformanceUpdated signals
enabled = true
# Interval for periodic performance snapshots to D-Bus subscribers (seconds)
snapshot_interval_secs = 5
# HTTP metrics server bind address (Prometheus + /health endpoint)
# Only active when the metrics-server feature is enabled
metrics_bind = "127.0.0.1:9100"

# =============================================================================
# GUI State (Persisted between sessions)
# =============================================================================
# These settings are managed by the GUI and persist UI preferences.
# You generally don't need to edit these manually.
[gui_state]
# Enable expert mode (shows advanced options in all tabs)
expert_mode = false
# EGFX expert mode (shows all EGFX parameters)
egfx_expert_mode = false
# Expanded section states (true = expanded, false = collapsed)
video_pipeline_expanded = false
adaptive_fps_expanded = true
latency_expanded = true
damage_tracking_expanded = true
hardware_encoding_expanded = true
display_expanded = true
advanced_video_expanded = false
cursor_expanded = true
cursor_predictor_expanded = false
multimon_expanded = false
logging_expanded = false
# Log viewer preferences
log_auto_scroll = true
log_filter_level = "info"
# Close behavior: true = closing GUI stops server (default)
#                 false = GUI closes but server keeps running (detach mode)
close_stops_server = true

# =============================================================================
# Diagnostics (troubleshooting only — not exposed in the GUI)
# =============================================================================
# These carry real cost: decode_self_test adds 10-20% CPU overhead and defeats
# adaptive FPS; dump_h264_to has no size cap and can fill a disk if left on.
# Enable only while actively debugging an encoder issue, then turn back off.
[diagnostics]
# Verify encoder output by decoding every frame server-side
decode_self_test = false
# Write the raw H.264 bitstream to this file for offline inspection
# dump_h264_to = "/tmp/lamco-rdp-server-h264.dump"
