name: lamco-rdp-server
title: Lamco RDP Server
version: '1.4.5'
summary: Native Wayland RDP server — Community Edition
description: |
  Lamco RDP Server — Community Edition

  Native Wayland RDP server using xdg-desktop-portal for screen capture
  and input injection. Built on IronRDP. Works with any Wayland
  compositor supporting RemoteDesktop and ScreenCast portals (GNOME, KDE,
  Sway, Hyprland, etc.).

  Connect to your Linux desktop from any standard RDP client (mstsc.exe,
  FreeRDP, Remmina). Includes graphical configuration tool, clipboard
  (Windows to Linux), and audio streaming.

  This is the Community Edition — free to use under the BUSL-1.1 license.
  For full bidirectional clipboard support, use the native installation.
license: BUSL-1.1
icon: snap/gui/icon.png
website: https://www.lamco.ai
source-code: https://github.com/lamco-admin/lamco-rdp-server
issues: https://github.com/lamco-admin/lamco-rdp-server/issues
contact: https://github.com/lamco-admin/lamco-rdp-server/issues
base: core24
grade: stable
confinement: strict

# The GUI starts the server with --dbus-service so it can reconnect to it, and
# the server owns io.lamco.RdpServer on the session bus for that. Under strict
# confinement owning a bus name needs a dbus slot; without it AppArmor denies the
# bind and the server used to exit before listening (found 2026-09-02, present
# since 1.4.4).
slots:
  rdp-server-dbus:
    interface: dbus
    bus: session
    name: io.lamco.RdpServer

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  lamco-rdp-server:
    command: bin/lamco-rdp-server
    slots:
      - rdp-server-dbus
    plugs:
      - network
      - network-bind
      - wayland
      - desktop
      - audio-playback
      - screen-inhibit-control
    environment:
      RUST_LOG: info
  gui:
    command: bin/lamco-rdp-server-gui
    command-chain:
      - bin/gui-launch
    slots:
      - rdp-server-dbus
    plugs:
      - network
      - network-bind
      - wayland
      - desktop
      - desktop-legacy
      - opengl
      - audio-playback
      - screen-inhibit-control
    environment:
      RUST_LOG: info
      WINIT_UNIX_BACKEND: wayland

parts:
  # Minimal desktop-launch wrapper (command-chain) that symlinks the host
  # Wayland socket into the per-snap XDG_RUNTIME_DIR and points libxkbcommon at
  # the staged XKB data. This is what the gnome extension does internally, minus
  # the several-hundred-MB GTK/GNOME platform runtime.
  launcher:
    plugin: dump
    source: snap/local/
    organize:
      gui-launch: bin/gui-launch
    override-prime: |
      craftctl default
      chmod +x $CRAFT_PRIME/bin/gui-launch

  lamco-rdp-server:
    plugin: rust
    source: https://github.com/lamco-admin/lamco-rdp-server/releases/download/v1.4.5/lamco-rdp-server-1.4.5.tar.xz
    # Vendored tarball includes .cargo/config.toml + vendor/
    rust-cargo-parameters:
      - --frozen
      - --no-default-features
      - --features
      - h264,vaapi,opus-libopus,libei,gui
    # Thin LTO + more codegen units keep peak memory within the Launchpad
    # remote-build workers (fat LTO over 886 vendored crates peaks 8-10GB).
    # Same override the RPM Fusion / AUR / OBS channels use; it overrides the
    # tarball's [profile.release] without editing the source.
    build-environment:
      - CARGO_PROFILE_RELEASE_LTO: "thin"
      - CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    build-packages:
      - build-essential
      - pkg-config
      - clang
      - cmake
      - nasm
      - libpipewire-0.3-dev
      - libxkbcommon-dev
      - libfuse3-dev
      - libdbus-1-dev
      - libssl-dev
      - libva-dev
    stage-packages:
      - libpipewire-0.3-0
      - libxkbcommon0
      - libfuse3-3
      - libdbus-1-3
      - libssl3
      - libgl1
      - libegl1
      - libgles2
      - libvulkan1
      - libwayland-client0
      - libwayland-egl1
      - libfontconfig1
      - xkb-data            # /usr/share/X11/xkb keymap data (fixes XKBNotFound)
      - fonts-dejavu-core   # fallback font so text renders under strict confinement
      - mesa-vulkan-drivers # wgpu Vulkan ICD
      - libgl1-mesa-dri     # GL/GLES fallback ICD
      - libva2              # VA-API loader (cros-libva is a hard link-time dep once vaapi is enabled)
      - libva-drm2
      - mesa-va-drivers                 # AMD (radeonsi) VA-API driver
      # The Intel drivers exist only on amd64; staging them unconditionally
      # failed the Launchpad arm64 build (2026-09-03).
      - on amd64:
        - i965-va-driver                  # Intel VA-API driver (pre-Broadwell iGPUs)
        - intel-media-va-driver-non-free  # Intel VA-API driver (Broadwell+, H.264 encode)
